name: Claude review

on:
    workflow_call:
        inputs:
            model:
                description: Model for the review.
                type: string
                default: claude-opus-5-5
            effort:
                description: Reasoning effort for the review.
                type: string
                default: high
        secrets:
            CLAUDE_CODE_OAUTH_TOKEN:
                required: true

permissions: {}

defaults:
    run:
        shell: bash

concurrency:
    group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        name: Claude review
        # CODE_REVIEWS is an organization variable, and can be overridden by a
        # repository variable of the same name. Its value is the list of reviews
        # to run, separated by commas with no spaces, such as `claude,codex`.
        #
        # A pull request from a fork is not reviewed: under pull_request_target
        # its job would run with this repository's secrets.
        # author_association is not checked: GitHub has reported the same
        # organization member as CONTRIBUTOR in one repository and MEMBER in
        # another.
        if: >-
            contains(format(',{0},', vars.CODE_REVIEWS), ',claude,') &&
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            !github.event.pull_request.draft
        runs-on: [self-hosted, X64]
        timeout-minutes: 90
        # claude-code-action exchanges an OIDC token for a Claude GitHub App
        # token, and posts the review with the app token, not GITHUB_TOKEN.
        permissions:
            contents: read
            id-token: write
            actions: read # claude-code-action skips its github_ci MCP server without this.
        steps:
            # Before Claude starts, claude-code-action restores .claude/,
            # CLAUDE.md and Claude Code's other configuration paths from the
            # base branch, and removes those that the base branch lacks.
            - name: Check out the pull request
              id: checkout
              timeout-minutes: 2
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 1
                  # claude-code-action fetches with its own app token, and
                  # cannot remove credentials that checkout persists.
                  persist-credentials: false

            - name: Get the review skills
              id: skills
              uses: solmyrhq/actions/skills@9893d8eac03120a797314d7c4b2b38a9170b03a6

            # claude-code-action would remove a skill in the checkout's .claude/.
            #
            # The base branch's .claude/settings.json is Claude Code's project
            # settings. Its env.ANTHROPIC_BASE_URL can be a server that the
            # runner cannot reach, and its apiKeyHelper a command that the
            # runner cannot run. In either case, the review fails. The
            # action's `settings` input cannot replace these values, because
            # the action merges it into the user settings, which rank below
            # the project settings.
            - name: Set up Claude's configuration
              id: config
              timeout-minutes: 1
              env:
                  SKILLS: ${{ steps.skills.outputs.path }}
              run: |
                  config="$RUNNER_TEMP/claude-review/config"
                  rm -rf "$RUNNER_TEMP/claude-review"
                  mkdir -p "$config/skills"
                  cp -R "$SKILLS/exhaustive-review" "$config/skills/exhaustive-review"
                  jq -n '{apiKeyHelper: "", env: {ANTHROPIC_BASE_URL: "https://api.anthropic.com"}}' > "$RUNNER_TEMP/claude-review/settings.json"
                  echo "path=$config" >> "$GITHUB_OUTPUT"
                  echo "settings=$RUNNER_TEMP/claude-review/settings.json" >> "$GITHUB_OUTPUT"

            - name: Review the pull request
              id: claude-review
              uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
              env:
                  CLAUDE_CONFIG_DIR: ${{ steps.config.outputs.path }}
                  # Under claude-code-action, Claude Code ends the run when the
                  # model returns its final result, even while background
                  # subagents are still working.
                  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # Ansible installs this Bun on the runners. Without this
                  # setting, the action installs its own pinned Bun while the
                  # Claude and GitHub App tokens are in scope.
                  path_to_bun_executable: /usr/local/bin/bun

                  base_branch: ${{ github.event.pull_request.base.ref }}

                  # With a prompt and no track_progress, the action runs in
                  # agent mode, and starts the inline-comment and CI MCP
                  # servers only when their tools are listed in --allowedTools.
                  claude_args: |
                      --model ${{ inputs.model }}
                      --effort ${{ inputs.effort }}
                      --settings ${{ steps.config.outputs.settings }}
                      --allowedTools
                      "Read"
                      "Glob"
                      "Grep"
                      "Task"
                      "Agent"
                      "TodoWrite"
                      "Bash(gh pr view ${{ github.event.pull_request.number }}:*)"
                      "Bash(gh pr diff ${{ github.event.pull_request.number }}:*)"
                      "Bash(gh pr comment ${{ github.event.pull_request.number }}:*)"
                      "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate)"
                      "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --paginate)"
                      "Bash(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --paginate)"
                      "Bash(gh api graphql:*)"
                      "mcp__github_inline_comment__create_inline_comment"
                      "mcp__github_ci__get_ci_status"
                      "mcp__github_ci__get_workflow_run_details"
                      "mcp__github_ci__download_job_log"

                  prompt: |
                      /exhaustive-review You are running in CI. Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} at head commit ${{ github.event.pull_request.head.sha }}.

            - name: Print Claude's error
              if: failure() && steps.claude-review.outputs.execution_file != ''
              timeout-minutes: 1
              env:
                  EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
              run: jq 'map(select(.type == "result")) | last | {subtype, is_error, result, errors}' "$EXECUTION_FILE"

            # If the job is cancelled while claude-code-action runs, the
            # action's revoke step can be skipped, and the app token stays
            # valid for up to an hour.
            - name: Remove the app token from the checkout
              if: always() && steps.checkout.outcome == 'success'
              timeout-minutes: 1
              run: git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

            - name: Remove Claude's configuration
              if: always()
              timeout-minutes: 1
              run: rm -rf "$RUNNER_TEMP/claude-review"
