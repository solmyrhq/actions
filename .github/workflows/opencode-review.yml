name: OpenCode review

on:
    workflow_call:
        inputs:
            pr:
                description: Pull request number, for a manual dispatch.
                type: string
                default: ""
            guide:
                description: >-
                    Path of the file in the calling repository that holds the
                    instructions for agents. The workflow reads this file from
                    the pull request's base commit.
                type: string
                default: CLAUDE.md
        secrets:
            OPENROUTER_API_KEY:
                required: true

permissions: {}

concurrency:
    group: opencode-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr }}
    cancel-in-progress: true

jobs:
    review:
        name: OpenCode review
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request_target' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             !github.event.pull_request.draft)
        runs-on: self-hosted
        timeout-minutes: 80
        permissions:
            contents: read
            pull-requests: read
        outputs:
            review: ${{ steps.prepare.outputs.review }}
            pr_number: ${{ steps.prepare.outputs.pr_number }}
            head_sha: ${{ steps.prepare.outputs.head_sha }}
        steps:
            - name: Check the pull request
              id: prepare
              timeout-minutes: 3
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  if [ -z "$PR_NUMBER" ]; then
                      echo "No pull request number was supplied." >&2
                      exit 1
                  fi
                  pr_json="$RUNNER_TEMP/pr.json"
                  if ! gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,isDraft,isCrossRepository,baseRefOid,headRefOid > "$pr_json"; then
                      echo "Could not read pull request #$PR_NUMBER." >&2
                      exit 1
                  fi
                  if [ "$(jq -r '.state' "$pr_json")" != "OPEN" ] || [ "$(jq -r '.isDraft' "$pr_json")" = "true" ] || [ "$(jq -r '.isCrossRepository' "$pr_json")" = "true" ]; then
                      echo "Pull request #$PR_NUMBER is closed, a draft, or from a fork; skipping." >&2
                      echo "review=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  {
                      echo "review=true"
                      echo "pr_number=$PR_NUMBER"
                      echo "head_sha=$(jq -r '.headRefOid' "$pr_json")"
                      echo "base_sha=$(jq -r '.baseRefOid' "$pr_json")"
                  } >> "$GITHUB_OUTPUT"

            - name: Check out the pull request
              id: checkout
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 2
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ steps.prepare.outputs.head_sha }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Get the review harness
              id: harness
              if: steps.prepare.outputs.review == 'true'
              uses: solmyrhq/actions/opencode-review@a7acb56bc50c90d9d927345055ee94cee22805ad

            # OpenCode runs the plugins in .opencode before it consults any
            # permission. No permission rule can stop a plugin that the pull
            # request adds.
            - name: Install the harness
              id: install-harness
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 2
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
                  GUIDE: ${{ inputs.guide }}
                  HARNESS: ${{ steps.harness.outputs.path }}
              run: |
                  guide="$RUNNER_TEMP/guide.md"
                  if ! gh api "repos/$REPOSITORY/contents/$GUIDE?ref=$BASE_SHA" -H "Accept: application/vnd.github.raw" > "$guide" || [ ! -s "$guide" ]; then
                      echo "Could not read the guide $GUIDE at the base commit $BASE_SHA." >&2
                      exit 1
                  fi
                  rm -rf .opencode opencode.json opencode.jsonc AGENTS.md
                  mkdir -p .opencode/agents .opencode/skills
                  cp "$HARNESS/agents/pr-review.md" .opencode/agents/pr-review.md
                  cp -R "$HARNESS/skills/." .opencode/skills/
                  cp "$guide" .opencode/guide.md
                  printf '%s\n' '{"$schema":"https://opencode.ai/config.json","instructions":[".opencode/guide.md"]}' > opencode.json

            - name: Install OpenCode
              id: install
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 5
              run: |
                  version=2.1.4
                  sha256=ce05abe2dce1041391c8ec8cdb8da066f640fd471e72ac846dcb089c441e11e1
                  mkdir -p "$RUNNER_TEMP/opencode"
                  curl --fail --silent --show-error --location \
                      "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-$version.tgz" \
                      --output "$RUNNER_TEMP/opencode/opencode.tgz"
                  printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/opencode/opencode.tgz" | sha256sum --check --strict
                  tar --extract --gzip --file "$RUNNER_TEMP/opencode/opencode.tgz" --directory "$RUNNER_TEMP/opencode"
                  install --mode 0755 "$RUNNER_TEMP/opencode/package/bin/opencode" "$RUNNER_TEMP/opencode/opencode"

            - name: Read the review threads
              id: threads
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 3
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  rm -rf review-output
                  mkdir -p review-output
                  gh api graphql --paginate --slurp \
                      -f owner="${REPOSITORY%/*}" \
                      -f repo="${REPOSITORY#*/}" \
                      -F number="$PR_NUMBER" \
                      -f query='
                  query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $endCursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id isResolved isOutdated path line originalLine
                            comments(first: 100) { nodes { author { login } body createdAt } }
                          }
                        }
                      }
                    }
                  }' > "$RUNNER_TEMP/threads-pages.json"
                  jq '[.[].data.repository.pullRequest.reviewThreads.nodes[]]' "$RUNNER_TEMP/threads-pages.json" > review-output/threads.json

            - name: Review the pull request
              id: review
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 50
              env:
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
                  HARNESS: ${{ steps.harness.outputs.path }}
                  HOME: ${{ runner.temp }}/opencode-home
                  XDG_CONFIG_HOME: ${{ runner.temp }}/opencode-home/config
                  XDG_DATA_HOME: ${{ runner.temp }}/opencode-home/data
                  XDG_CACHE_HOME: ${{ runner.temp }}/opencode-home/cache
                  XDG_STATE_HOME: ${{ runner.temp }}/opencode-home/state
                  # With this set, OpenCode does not look for skills in
                  # .claude or .agents, where the pull request could add its
                  # own.
                  OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
              run: |
                  mkdir -p "$HOME" "$XDG_CONFIG_HOME/opencode" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
                  printf '%s\n' '{"$schema":"https://opencode.ai/config.json","update":"disable","snapshots":false}' > "$XDG_CONFIG_HOME/opencode/opencode.json"
                  prompt=$(printf '%s\n\nReview pull request #%s in %s at head commit %s.\n' "$(cat "$HARNESS/prompt.md")" "$PR_NUMBER" "$REPOSITORY" "$HEAD_SHA")
                  "$RUNNER_TEMP/opencode/opencode" run \
                      --standalone \
                      --auto \
                      --agent pr-review \
                      --model 'openrouter/deepseek/deepseek-v4.1-flash-1017#max' \
                      "$prompt"

            - name: Restore the reviewed files
              id: restore
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 1
              run: |
                  for path in .opencode opencode.json opencode.jsonc AGENTS.md; do
                      rm -rf "$path"
                      git checkout HEAD -- "$path" 2>/dev/null || true
                  done

            - name: Check the review files
              id: verify
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 3
              env:
                  HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
              # `opencode run` exits 0 even when the model changes the working
              # tree or writes no summary.
              run: |
                  if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)review-output')" ]; then
                      echo "The review changed the working tree:" >&2
                      git status --porcelain --untracked-files=all -- . ':(exclude)review-output' >&2
                      exit 1
                  fi
                  marker="<!-- opencode-code-review:$HEAD_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT -->"
                  if [ ! -s review-output/summary.md ]; then
                      echo "The review wrote no summary." >&2
                      exit 1
                  fi
                  if grep -q '^<!-- opencode-code-review:' review-output/summary.md; then
                      echo "The summary already carries a marker." >&2
                      exit 1
                  fi
                  { printf '%s\n' "$marker"; cat review-output/summary.md; } > review-output/summary.new
                  mv review-output/summary.new review-output/summary.md
                  [ -s review-output/resolve.json ] || printf '{"threads": []}\n' > review-output/resolve.json
                  if ! jq -e '(.threads | type) == "array" and all(.threads[]; (.id | type) == "string" and (.id | length) > 0 and (.reason | type) == "string" and (.reason | length) > 0)' review-output/resolve.json > /dev/null; then
                      echo "resolve.json is not a list of thread ids and reasons." >&2
                      exit 1
                  fi
                  for id in $(jq -r '.threads[].id' review-output/resolve.json); do
                      if ! grep -Fq "$id" review-output/summary.md; then
                          echo "The summary does not list the thread $id that it asks to resolve." >&2
                          exit 1
                      fi
                  done
                  for file in review-output/comment-*.json; do
                      [ -e "$file" ] || continue
                      if ! jq -e --arg sha "$HEAD_SHA" '(.body | type) == "string" and (.commit_id == $sha) and (.path | type) == "string" and (.line | type) == "number" and (.side == "RIGHT" or .side == "LEFT")' "$file" > /dev/null; then
                          echo "$file is not a valid inline comment." >&2
                          exit 1
                      fi
                      if jq -e '.body | startswith("<!-- opencode-code-review:")' "$file" > /dev/null; then
                          echo "$file already carries a marker." >&2
                          exit 1
                      fi
                      jq --arg marker "$marker" '.body = $marker + "\n" + .body' "$file" > "$file.new"
                      mv "$file.new" "$file"
                  done

            - name: Upload the review
              id: upload
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 2
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: opencode-review-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      review-output/comment-*.json
                      review-output/summary.md
                      review-output/resolve.json
                  if-no-files-found: error
                  retention-days: 1

            - name: Remove OpenCode and its state
              id: cleanup
              if: always()
              timeout-minutes: 1
              run: rm -rf review-output "$RUNNER_TEMP/opencode" "$RUNNER_TEMP/opencode-home" "$RUNNER_TEMP/guide.md" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/threads-pages.json"

    publish:
        name: Post the OpenCode review
        needs: review
        if: needs.review.result == 'success' && needs.review.outputs.review == 'true'
        runs-on: self-hosted
        timeout-minutes: 30
        permissions:
            contents: write # The resolveReviewThread mutation fails without it.
            pull-requests: write
        steps:
            - name: Download the review
              id: download
              timeout-minutes: 2
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: opencode-review-${{ github.run_id }}-${{ github.run_attempt }}
                  path: review-output

            - name: Post the inline comments
              id: comments
              timeout-minutes: 5
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ needs.review.outputs.pr_number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  for file in review-output/comment-*.json; do
                      [ -e "$file" ] || continue
                      if ! gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" --method POST --input "$file"; then
                          echo "::warning::Could not post $file; adding it to the summary." >&2
                          {
                              echo
                              echo "### Inline comment that could not be posted"
                              echo
                              jq -r '.body' "$file"
                          } >> review-output/summary.md
                      fi
                  done

            - name: Post the summary
              id: summary
              timeout-minutes: 3
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ needs.review.outputs.pr_number }}
                  REPOSITORY: ${{ github.repository }}
              run: gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file review-output/summary.md

            - name: Resolve the threads the review addressed
              id: resolve
              timeout-minutes: 10
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ needs.review.outputs.pr_number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  if [ ! -s review-output/resolve.json ]; then
                      echo "The review did not nominate any threads." >&2
                      exit 0
                  fi
                  threads=$(jq -c '.threads[]' review-output/resolve.json)
                  failed=0
                  while IFS= read -r thread; do
                      [ -n "$thread" ] || continue
                      id=$(jq -r '.id' <<< "$thread")
                      reason=$(jq -r '.reason' <<< "$thread")
                      row=$(gh api graphql \
                          -f threadId="$id" \
                          -f query='
                  query($threadId: ID!) {
                    node(id: $threadId) {
                      ... on PullRequestReviewThread {
                        isResolved
                        pullRequest { number }
                        comments(first: 1) { nodes { author { login } body } }
                      }
                    }
                  }' --jq '[.data.node.isResolved, (.data.node.pullRequest.number // 0), (.data.node.comments.nodes[0].author.login // ""), ((.data.node.comments.nodes[0].body // "") | contains("<!-- opencode-code-review:"))] | @tsv') || row=""
                      IFS=$'\t' read -r resolved pr_number author opencode_thread <<< "$row" || true
                      if [ "$resolved" = "true" ]; then
                          echo "Already resolved $id"
                          continue
                      fi
                      if [ "$resolved" != "false" ] || [ "$pr_number" != "$PR_NUMBER" ] || [ "$author" != "github-actions" ] || [ "$opencode_thread" != "true" ]; then
                          echo "::warning::Refusing to resolve $id: resolved=$resolved pull-request=$pr_number author=$author opencode-thread=$opencode_thread" >&2
                          failed=1
                          continue
                      fi
                      gh api graphql \
                          -f threadId="$id" \
                          -f query='
                  mutation($threadId: ID!) {
                    resolveReviewThread(input: { threadId: $threadId }) { thread { isResolved } }
                  }' > /dev/null
                      echo "Resolved $id: $reason"
                  done <<< "$threads"
                  exit "$failed"

            - name: Check the summary
              id: verify
              timeout-minutes: 3
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ needs.review.outputs.pr_number }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_SHA: ${{ needs.review.outputs.head_sha }}
              run: |
                  comments=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                      --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
                  if ! grep -Fq "opencode-code-review:$HEAD_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" <<< "$comments"; then
                      echo "No summary comment carries the marker for this run." >&2
                      exit 1
                  fi

            - name: Remove the review files
              id: cleanup
              if: always()
              timeout-minutes: 1
              run: rm -rf review-output
