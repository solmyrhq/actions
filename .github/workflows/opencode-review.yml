name: OpenCode review

on:
    workflow_call:
        inputs:
            pr:
                description: Pull request number, for a manual dispatch.
                type: string
                default: ""
            guide:
                description: >-
                    Path of the file in the calling repository that holds the
                    instructions for agents. The workflow reads this file from
                    the pull request's base commit.
                type: string
                default: CLAUDE.md
            model:
                description: >-
                    OpenRouter model for the review, without the openrouter/
                    prefix. If this input is empty, the workflow uses the
                    OPENCODE_REVIEW_MODEL variable. If that variable is not
                    set, the workflow uses deepseek/deepseek-v4.1-flash-1017.
                type: string
                default: ""
            effort:
                description: >-
                    Reasoning effort for the review, as the name of an OpenCode
                    model variant. If this input is empty, the workflow uses
                    the OPENCODE_REVIEW_EFFORT variable. If that variable is
                    not set, the workflow uses max.
                type: string
                default: ""
        secrets:
            OPENROUTER_API_KEY:
                required: true

permissions: {}

concurrency:
    group: opencode-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr }}
    cancel-in-progress: true

jobs:
    review:
        name: OpenCode review
        # CODE_REVIEWS is an organization variable, and can be overridden by a
        # repository variable of the same name. Its value is the list of reviews
        # to run, separated by commas with no spaces, such as `claude,codex`.
        #
        # Pull requests in a public repository are not reviewed: anyone can
        # comment on them, and the model can read every comment.
        if: >-
            contains(format(',{0},', vars.CODE_REVIEWS), ',opencode,') &&
            github.event.repository.private && (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request_target' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             !github.event.pull_request.draft))
        runs-on: [self-hosted, X64]
        timeout-minutes: 80
        permissions:
            contents: read
            pull-requests: read
        outputs:
            review: ${{ steps.prepare.outputs.review }}
            pr_number: ${{ steps.prepare.outputs.pr-number }}
            head_sha: ${{ steps.prepare.outputs.head-sha }}
            # A re-run of only the publish job has a higher run_attempt than
            # the attempt that uploaded the artifact.
            artifact: ${{ steps.prepare.outputs.artifact }}
        steps:
            - name: Check the pull request
              id: prepare
              timeout-minutes: 3
              uses: solmyrhq/actions/review-prepare@9893d8eac03120a797314d7c4b2b38a9170b03a6
              with:
                  token: ${{ github.token }}
                  pr: ${{ github.event.pull_request.number || inputs.pr }}
                  artifact-prefix: opencode-review

            - name: Check out the pull request
              id: checkout
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 2
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ steps.prepare.outputs.head-sha }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Get the review harness
              id: harness
              if: steps.prepare.outputs.review == 'true'
              uses: solmyrhq/actions/opencode-review@9893d8eac03120a797314d7c4b2b38a9170b03a6

            - name: Get the review skills
              id: skills
              if: steps.prepare.outputs.review == 'true'
              uses: solmyrhq/actions/skills@9893d8eac03120a797314d7c4b2b38a9170b03a6

            # OpenCode runs the plugins in .opencode before it consults any
            # permission. No permission rule can stop a plugin that the pull
            # request adds.
            - name: Install the harness
              id: install-harness
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 2
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  BASE_SHA: ${{ steps.prepare.outputs.base-sha }}
                  GUIDE: ${{ inputs.guide }}
                  HARNESS: ${{ steps.harness.outputs.path }}
                  SKILLS: ${{ steps.skills.outputs.path }}
              run: |
                  guide="$RUNNER_TEMP/guide.md"
                  if ! gh api "repos/$REPOSITORY/contents/$GUIDE?ref=$BASE_SHA" -H "Accept: application/vnd.github.raw" > "$guide" || [ ! -s "$guide" ]; then
                      echo "Could not read the guide $GUIDE at the base commit $BASE_SHA." >&2
                      exit 1
                  fi
                  rm -rf .opencode opencode.json opencode.jsonc AGENTS.md
                  mkdir -p .opencode/agents .opencode/skills
                  cp "$HARNESS/agents/pr-review.md" .opencode/agents/pr-review.md
                  cp -R "$SKILLS/exhaustive-review" .opencode/skills/exhaustive-review
                  # SKILL.md links to ../opencode-tools.md.
                  cp "$SKILLS/opencode-tools.md" .opencode/skills/opencode-tools.md
                  cp "$guide" .opencode/guide.md
                  # shellcheck disable=SC2016 # "$schema" is a JSON key.
                  printf '%s\n' '{"$schema":"https://opencode.ai/config.json","instructions":[".opencode/guide.md"]}' > opencode.json

            - name: Install OpenCode
              id: install
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 5
              run: |
                  version=2.1.4
                  sha256=ce05abe2dce1041391c8ec8cdb8da066f640fd471e72ac846dcb089c441e11e1
                  mkdir -p "$RUNNER_TEMP/opencode"
                  curl --fail --silent --show-error --location \
                      "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-$version.tgz" \
                      --output "$RUNNER_TEMP/opencode/opencode.tgz"
                  printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/opencode/opencode.tgz" | sha256sum --check --strict
                  tar --extract --gzip --file "$RUNNER_TEMP/opencode/opencode.tgz" --directory "$RUNNER_TEMP/opencode"
                  install --mode 0755 "$RUNNER_TEMP/opencode/package/bin/opencode" "$RUNNER_TEMP/opencode/opencode"

            - name: Read the review threads
              id: threads
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 3
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  rm -rf review-output
                  mkdir -p review-output
                  # shellcheck disable=SC2016 # The $variables are GraphQL variables.
                  gh api graphql --paginate --slurp \
                      -f owner="${REPOSITORY%/*}" \
                      -f repo="${REPOSITORY#*/}" \
                      -F number="$PR_NUMBER" \
                      -f query='
                  query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $endCursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id isResolved isOutdated path line originalLine
                            comments(first: 100) { nodes { author { login } body createdAt } }
                          }
                        }
                      }
                    }
                  }' > "$RUNNER_TEMP/threads-pages.json"
                  jq '[.[].data.repository.pullRequest.reviewThreads.nodes[]]' "$RUNNER_TEMP/threads-pages.json" > review-output/threads.json

            # The model may run `gh ... --jq <expression>`, and jq's `env`
            # prints the process environment. If the key were in the
            # environment of the step that runs OpenCode, the model could copy
            # it into the review, and the publish job would post it.
            - name: Write the OpenRouter key
              id: key
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 1
              env:
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
              run: |
                  umask 077
                  mkdir -p "$RUNNER_TEMP/opencode-secrets"
                  printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/opencode-secrets/openrouter-key"

            - name: Review the pull request
              id: review
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 50
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_SHA: ${{ steps.prepare.outputs.head-sha }}
                  HARNESS: ${{ steps.harness.outputs.path }}
                  MODEL: ${{ inputs.model || vars.OPENCODE_REVIEW_MODEL || 'deepseek/deepseek-v4.1-flash-1017' }}
                  EFFORT: ${{ inputs.effort || vars.OPENCODE_REVIEW_EFFORT || 'max' }}
                  HOME: ${{ runner.temp }}/opencode-home
                  XDG_CONFIG_HOME: ${{ runner.temp }}/opencode-home/config
                  XDG_DATA_HOME: ${{ runner.temp }}/opencode-home/data
                  XDG_CACHE_HOME: ${{ runner.temp }}/opencode-home/cache
                  XDG_STATE_HOME: ${{ runner.temp }}/opencode-home/state
                  # With this set, OpenCode does not look for skills in
                  # .claude or .agents, where the pull request could add its
                  # own.
                  OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
                  OPENCODE_DISABLE_CLAUDE_CODE: "1"
              run: |
                  for value in "$MODEL" "$EFFORT"; do
                      case "$value" in
                          '' | *[!A-Za-z0-9._/:-]*)
                              echo "The model or the reasoning effort contains a character that is not allowed." >&2
                              exit 1
                              ;;
                      esac
                  done
                  mkdir -p "$HOME" "$XDG_CONFIG_HOME/opencode" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
                  key_file="$RUNNER_TEMP/opencode-secrets/openrouter-key"
                  # shellcheck disable=SC2016 # "$schema" is a JSON key, and $key is a jq variable.
                  jq -n --arg key "{file:$key_file}" \
                      '{"$schema": "https://opencode.ai/config.json", update: "disable", snapshots: false, providers: {openrouter: {settings: {apiKey: $key}}}}' \
                      > "$XDG_CONFIG_HOME/opencode/opencode.json"
                  prompt=$(printf '%s\n\nReview pull request #%s in %s at head commit %s.\n' "$(cat "$HARNESS/prompt.md")" "$PR_NUMBER" "$REPOSITORY" "$HEAD_SHA")
                  "$RUNNER_TEMP/opencode/opencode" run \
                      --standalone \
                      --auto \
                      --agent pr-review \
                      --model "openrouter/$MODEL#$EFFORT" \
                      "$prompt"

            - name: Restore the reviewed files
              id: restore
              if: always() && steps.prepare.outputs.review == 'true'
              timeout-minutes: 1
              run: |
                  for path in .opencode opencode.json opencode.jsonc AGENTS.md; do
                      rm -rf "$path"
                      git checkout HEAD -- "$path" 2>/dev/null || true
                  done

            # `opencode run` exits 0 even when the model changes the working
            # tree.
            - name: Check that the review changed nothing
              id: unchanged
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 1
              run: |
                  if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)review-output')" ]; then
                      echo "The review changed the working tree:" >&2
                      git status --porcelain --untracked-files=all -- . ':(exclude)review-output' >&2
                      exit 1
                  fi

            - name: Check the review
              id: verify
              if: steps.prepare.outputs.review == 'true'
              uses: solmyrhq/actions/review-check@9893d8eac03120a797314d7c4b2b38a9170b03a6
              with:
                  directory: review-output
                  marker: opencode-code-review
                  head-sha: ${{ steps.prepare.outputs.head-sha }}

            - name: Upload the review
              id: upload
              if: steps.prepare.outputs.review == 'true'
              timeout-minutes: 2
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.prepare.outputs.artifact }}
                  path: |
                      review-output/comment-*.json
                      review-output/summary.md
                      review-output/resolve.json
                  if-no-files-found: error
                  retention-days: 1

            - name: Remove OpenCode and its state
              id: cleanup
              if: always()
              timeout-minutes: 1
              run: rm -rf review-output "$RUNNER_TEMP/opencode" "$RUNNER_TEMP/opencode-home" "$RUNNER_TEMP/opencode-secrets" "$RUNNER_TEMP/guide.md" "$RUNNER_TEMP/threads-pages.json"

    publish:
        name: Post the OpenCode review
        needs: review
        if: needs.review.result == 'success' && needs.review.outputs.review == 'true'
        runs-on: [self-hosted, X64]
        timeout-minutes: 30
        permissions:
            contents: write # The resolveReviewThread mutation fails without it.
            pull-requests: write
        steps:
            - name: Download the review
              id: download
              timeout-minutes: 2
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.review.outputs.artifact }}
                  path: review-output

            - name: Post the review
              id: publish
              timeout-minutes: 25
              uses: solmyrhq/actions/review-publish@9893d8eac03120a797314d7c4b2b38a9170b03a6
              with:
                  token: ${{ github.token }}
                  directory: review-output
                  marker: opencode-code-review
                  pr: ${{ needs.review.outputs.pr_number }}
                  head-sha: ${{ needs.review.outputs.head_sha }}

            - name: Remove the review files
              id: cleanup
              if: always()
              timeout-minutes: 1
              run: rm -rf review-output
