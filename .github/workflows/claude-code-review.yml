name: Claude Code Review

on:
    pull_request_target:
        types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
    review:
        uses: ./.github/workflows/claude-review.yml
        permissions:
            contents: read
            id-token: write
            actions: read
        secrets:
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
