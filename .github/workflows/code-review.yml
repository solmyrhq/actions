name: Code Review

on:
    # zizmor: ignore[dangerous-triggers] The one job only calls review.yml at this commit, and every review that it calls skips pull requests from forks.
    pull_request_target:
        types: [opened, synchronize, ready_for_review, reopened]
    workflow_dispatch:
        inputs:
            pr:
                description: Pull request number
                required: true

permissions: {}

jobs:
    review:
        uses: $/.github/workflows/review.yml
        permissions:
            actions: read # for the Claude review
            contents: write # for the Codex and OpenCode reviews
            id-token: write # for the Claude review
            pull-requests: write # for the Codex and OpenCode reviews
        with:
            pr: ${{ inputs.pr }}
            guide: README.md
        # Not `secrets: inherit`, which would hand review.yml every repository
        # and organization secret, not only these.
        secrets:
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
            CLIPROXY_BASE_URL: ${{ secrets.CLIPROXY_BASE_URL }}
            CODE_REVIEW_TS_OAUTH_SECRET: ${{ secrets.CODE_REVIEW_TS_OAUTH_SECRET }}
