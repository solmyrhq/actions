name: Code Review

on:
    pull_request_target:
        types: [opened, synchronize, ready_for_review, reopened]
    workflow_dispatch:
        inputs:
            pr:
                description: Pull request number
                required: true

permissions: {}

jobs:
    review:
        uses: ./.github/workflows/review.yml
        permissions:
            actions: read
            contents: write
            id-token: write
            pull-requests: write
        with:
            pr: ${{ inputs.pr }}
            guide: README.md
        secrets: inherit
