name: Check a review
description: >-
  Checks the summary, inline comments and threads to resolve that a model wrote
  for a pull request review, and adds this run's marker to the summary and to
  each inline comment. The action fails if summary.md is missing or empty, or
  if resolve.json or a comment-*.json file is not valid. It also fails if the
  summary does not list a thread in resolve.json, or if the summary or an
  inline comment already starts with a marker.

inputs:
  directory:
    description: >-
      Directory that holds summary.md. It can also hold resolve.json and
      comment-*.json files. When `structured-review` is set, the directory must
      be empty.
    required: true
  marker:
    description: Name of the review's marker, such as `codex-code-review`.
    required: true
  head-sha:
    description: The pull request's head commit, which every inline comment must name.
    required: true
  structured-review:
    description: >-
      Path of a review in one JSON object with `comments`, `summary` and
      `resolve`, as codex-review/output-schema.json describes. When set, the
      action first writes it to `directory` as the files above.
    required: false
    default: ""

outputs:
  marker:
    description: This run's marker, `<!-- <marker>:<head-sha>:<run id>:<run attempt> -->`.

runs:
  using: node24
  main: main.js
