# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
    profile: "assertive"
    request_changes_workflow: false
    high_level_summary: true
    poem: false
    review_status: true
    review_details: true
    collapse_walkthrough: true
    sequence_diagrams: true
    auto_review:
        enabled: true
        drafts: false
    path_instructions:
        - path: "**"
          instructions: >
              This repository holds GitHub Actions shared by the solmyrhq
              organization's private repositories. Every job in those
              repositories runs on self-hosted Debian 13 runners. The runner
              user has no sudo access and no Node of its own, and the runner
              VMs are not tailnet members. JavaScript actions declare
              `runs.using: node24` and have no npm dependencies and no build
              step, so the committed code is the code that runs. Callers pin
              each action to a full commit SHA. Tests run with `node --test`
              in a pinned Node 24 container.
    tools:
        gitleaks:
            enabled: true
        trufflehog:
            enabled: true
        shellcheck:
            enabled: true
        yamllint:
            enabled: true
        markdownlint:
            enabled: true
knowledge_base:
    code_guidelines:
        enabled: true
chat:
    auto_reply: true
