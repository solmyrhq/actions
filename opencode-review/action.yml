name: OpenCode review harness
description: >-
    The agent, prompt and skill that the OpenCode review in
    .github/workflows/opencode-review.yml runs with.

outputs:
    path:
        description: The directory that holds agents/, skills/ and prompt.md.
        value: ${{ steps.locate.outputs.path }}

runs:
    using: composite
    steps:
        # When an output's value is `${{ github.action_path }}`, callers
        # receive an empty string.
        - id: locate
          shell: bash
          run: |
              test -s "$GITHUB_ACTION_PATH/agents/pr-review.md"
              test -s "$GITHUB_ACTION_PATH/prompt.md"
              test -s "$GITHUB_ACTION_PATH/skills/exhaustive-review/SKILL.md"
              echo "path=$GITHUB_ACTION_PATH" >> "$GITHUB_OUTPUT"
