name: Choose the commit to deploy
description: >-
  Checks that a commit is on the first-parent chain of the deployed branch,
  and that a job passed in a run of the given workflow for that commit on the
  branch. Outputs the newest commit on that chain that passed the job. This
  commit can be newer than the given commit. If no commit is given, outputs
  the newest commit on the chain that passed the job.

inputs:
  token:
    description: >-
      A token with the `contents: read` and `actions: read` permissions, such as
      the job's GITHUB_TOKEN.
    required: true
  branch:
    description: The deployed branch, such as `main`. The action fails if the run is for another ref.
    required: true
  workflow:
    description: >-
      The file name of the workflow that runs the `job-name` job, such as
      `ci.yml`. Do not include the directory. The action counts only the runs
      of this workflow on `branch` that a push or a `workflow_dispatch` event
      started. The run of a pull request tests the merge of the pull request
      into its base branch, and this merge can differ from the commit on
      `branch`.
    required: true
  job-name:
    description: >-
      The name of the job that must pass, in a run of `workflow`. This is the
      job's `name`, or its ID if it has no `name`. For a job in a matrix or in
      a called workflow, GitHub adds to the name. Use the name that the page of
      the workflow run shows.
    required: true
  sha:
    description: >-
      The full SHA, in lower case, of the commit to check. If it is empty, the
      action outputs the newest commit on the first-parent chain of `branch`
      that passed the `job-name` job.
    required: false
    default: ""

outputs:
  sha:
    description: >-
      The full SHA of the commit to deploy. This is the newest commit on the
      first-parent chain of `branch`, from `sha` to the tip, that passed the
      `job-name` job. If no commit newer than `sha` passed, it is `sha`. If
      `sha` is empty, it is the newest commit on the chain that passed the
      `job-name` job.

runs:
  using: node24
  main: main.js
